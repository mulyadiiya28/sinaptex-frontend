<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="nodeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </radialGradient>
  </defs>
  
  <!-- Obsidian Rounded Canvas -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <rect width="190" height="190" x="1" y="1" rx="41" stroke="#27272a" stroke-width="1.5" fill="none"/>

  <!-- Web of Synaptic Connections -->
  <path d="M56 54 L136 138 M136 54 L56 138" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- The S Ribbon Core -->
  <path
    d="M134 58 C134 40, 118 30, 96 30 C70 30, 54 44, 54 64 C54 86, 74 96, 96 101 C122 106, 138 117, 138 138 C138 160, 118 170, 93 170 C67 170, 51 156, 51 138"
    stroke="url(#sGrad)"
    stroke-width="17"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- High-tech Inner Circuit Highlight -->
  <path
    d="M130 62 C130 76, 112 86, 93 91 C70 98, 58 108, 58 128"
    stroke="#ffffff"
    stroke-opacity="0.4"
    stroke-width="4.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Synaptic Intelligent Nodes -->
  <circle cx="134" cy="58" r="9" fill="url(#nodeGrad)"/>
  <circle cx="134" cy="58" r="4" fill="#ffffff"/>

  <circle cx="96" cy="101" r="7.5" fill="#38bdf8"/>
  <circle cx="96" cy="101" r="3" fill="#ffffff"/>

  <circle cx="51" cy="138" r="9" fill="url(#nodeGrad)"/>
  <circle cx="51" cy="138" r="4" fill="#ffffff"/>

  <!-- Satellite Network Points -->
  <circle cx="54" cy="62" r="5" fill="#60a5fa" opacity="0.8"/>
  <circle cx="138" cy="134" r="5" fill="#c084fc" opacity="0.8"/>
</svg>
