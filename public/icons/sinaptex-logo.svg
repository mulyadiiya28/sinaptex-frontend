<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <linearGradient id="brandSGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="brandNodeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </radialGradient>
    <filter id="brandGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" floodColor="#3b82f6" floodOpacity="0.3"/>
    </filter>
  </defs>

  <!-- Left S Mark -->
  <g transform="translate(20, 10)">
    <!-- Circuit lines -->
    <path d="M40 38 L100 102 M100 38 L40 102" stroke="#3b82f6" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="3 4"/>
    
    <!-- S Ribbon -->
    <path
      d="M98 42 C98 28, 86 20, 70 20 C52 20, 40 30, 40 45 C40 61, 54 68, 70 71 C88 74, 100 82, 100 97 C100 113, 86 120, 68 120 C50 120, 38 111, 38 97"
      stroke="url(#brandSGrad)"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#brandGlow)"
      fill="none"
    />

    <!-- Highlight stroke -->
    <path
      d="M96 45 C96 55, 82 62, 68 65 C52 69, 44 76, 44 91"
      stroke="#ffffff"
      stroke-opacity="0.45"
      stroke-width="3.5"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Synaptic Nodes -->
    <circle cx="98" cy="42" r="6.5" fill="url(#brandNodeGrad)"/>
    <circle cx="98" cy="42" r="2.5" fill="#ffffff"/>

    <circle cx="70" cy="71" r="5.5" fill="#38bdf8"/>
    <circle cx="70" cy="71" r="2" fill="#ffffff"/>

    <circle cx="38" cy="97" r="6.5" fill="url(#brandNodeGrad)"/>
    <circle cx="38" cy="97" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Typography: Sinaptex -->
  <text x="160" y="82" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#09090b" letter-spacing="-1">
    Sinaptex
  </text>

  <!-- Subtitle / Tagline: Ekosistem Bisnis dan Layanan Cerdas -->
  <text x="162" y="114" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#64748b" letter-spacing="0.2">
    Ekosistem Bisnis dan Layanan Cerdas
  </text>
</svg>
