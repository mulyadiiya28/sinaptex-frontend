<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="sGrad512" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="nodeGrad512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </radialGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" floodColor="#3b82f6" floodOpacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Obsidian Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" stroke="#27272a" stroke-width="4" fill="none"/>

  <!-- Network Circuit Lines -->
  <path d="M150 144 L362 368 M362 144 L150 368" stroke="#ffffff" stroke-opacity="0.08" stroke-width="5" stroke-dasharray="10 16"/>

  <!-- The S Ribbon Core -->
  <path
    d="M358 154 C358 108, 315 80, 256 80 C186 80, 144 118, 144 172 C144 230, 198 256, 256 269 C326 282, 368 312, 368 368 C368 426, 315 454, 248 454 C178 454, 136 416, 136 368"
    stroke="url(#sGrad512)"
    stroke-width="46"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow512)"
    fill="none"
  />

  <!-- High-tech Inner Circuit Highlight -->
  <path
    d="M348 165 C348 203, 300 229, 248 243 C186 262, 154 288, 154 341"
    stroke="#ffffff"
    stroke-opacity="0.45"
    stroke-width="12"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Synaptic Intelligent Nodes -->
  <circle cx="358" cy="154" r="24" fill="url(#nodeGrad512)"/>
  <circle cx="358" cy="154" r="10" fill="#ffffff"/>

  <circle cx="256" cy="269" r="20" fill="#38bdf8"/>
  <circle cx="256" cy="269" r="8" fill="#ffffff"/>

  <circle cx="136" cy="368" r="24" fill="url(#nodeGrad512)"/>
  <circle cx="136" cy="368" r="10" fill="#ffffff"/>

  <!-- Satellite Network Points -->
  <circle cx="144" cy="165" r="14" fill="#60a5fa" opacity="0.85"/>
  <circle cx="368" cy="358" r="14" fill="#c084fc" opacity="0.85"/>
</svg>
